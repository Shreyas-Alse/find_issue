[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "find_issue"
version = "0.1.0"
description = "Generate beginner-friendly GitHub contribution roadmaps from repository issues."
requires-python = ">=3.10"
dependencies = [
    "PyGithub",
    "python-dotenv",
    "langchain-core",
    "langchain-google-genai",
    "requests",
]

[project.scripts]
find_issue = "find_issue.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
